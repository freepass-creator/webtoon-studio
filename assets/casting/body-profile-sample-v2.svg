<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="3200" viewBox="0 0 2400 3200">
  <title>웹툰 스튜디오 배우 캐스팅 바디 프로필 샘플</title>
  <desc>실제 배우 사진 없이 정면, 정확한 측면, 후면, 0~200센티미터 절대척도와 기본 신체 정보를 보여 주는 CASTING-BODY-v2.0 샘플</desc>
  <defs>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111310"/>
      <stop offset="1" stop-color="#292B27"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8F6F1"/>
      <stop offset="1" stop-color="#EEEAE2"/>
    </linearGradient>
    <linearGradient id="slot" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E7E2D9"/>
      <stop offset="1" stop-color="#D6CFC3"/>
    </linearGradient>
    <pattern id="minorGrid" width="10" height="10" patternUnits="userSpaceOnUse">
      <path d="M 0 0 H 2140" fill="none" stroke="#C9C2B7" stroke-width="1" opacity=".20"/>
    </pattern>
    <pattern id="majorGrid" width="100" height="100" patternUnits="userSpaceOnUse">
      <path d="M 0 0 H 2140" fill="none" stroke="#AFA69A" stroke-width="2" opacity=".40"/>
    </pattern>
    <style>
      @font-face { font-family: '캐스팅고딕'; src: url('v2/fonts/NotoSansKR-400.woff2') format('woff2'); font-weight: 400; }
      @font-face { font-family: '캐스팅고딕'; src: url('v2/fonts/NotoSansKR-700.woff2') format('woff2'); font-weight: 700; }
      text { font-family: '캐스팅고딕', 'Noto Sans KR Thin', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; fill: #181916; }
      .brand { font-size: 24px; font-weight: 700; letter-spacing: 4px; }
      .title { font-size: 76px; font-weight: 700; letter-spacing: -3px; }
      .subtitle { font-size: 29px; font-weight: 400; letter-spacing: -.5px; }
      .section { font-size: 27px; font-weight: 700; letter-spacing: -.6px; }
      .label { font-size: 25px; font-weight: 700; }
      .metricLabel { font-size: 24px; font-weight: 400; fill: #777267; }
      .metricValue { font-size: 43px; font-weight: 700; letter-spacing: -1px; }
      .rulerMajor { font-size: 21px; font-weight: 700; fill: #7D3038; font-variant-numeric: tabular-nums; }
      .rulerMinor { font-size: 16px; font-weight: 400; fill: #8C857A; font-variant-numeric: tabular-nums; }
      .small { font-size: 19px; font-weight: 400; fill: #777267; }
      .tiny { font-size: 16px; font-weight: 400; fill: #777267; }
      .white { fill: #FFFDF9; }
      .wine { fill: #7D3038; }
    </style>
  </defs>

  <rect width="2400" height="3200" fill="url(#paper)"/>

  <!-- Agency-style header -->
  <rect width="2400" height="380" fill="url(#header)"/>
  <rect x="100" y="74" width="12" height="224" rx="6" fill="#A65A5E"/>
  <text x="154" y="103" class="brand white" opacity=".68">WEBTOON STUDIO · CASTING DIVISION</text>
  <text x="150" y="205" class="title white">후보 00 · 배우명</text>
  <text x="154" y="278" class="subtitle white" opacity=".82">작품명  /  배역명  /  바디 프로필</text>
  <rect x="1960" y="82" width="330" height="88" rx="44" fill="#7D3038"/>
  <text x="2125" y="140" class="section white" text-anchor="middle">샘플 양식</text>
  <text x="2290" y="238" class="small white" text-anchor="end" opacity=".72">실제 배우 아님</text>
  <text x="2290" y="278" class="tiny white" text-anchor="end" opacity=".56">CASTING-BODY-v2.0</text>

  <!-- Scale heading -->
  <text x="140" y="450" class="section">신체 절대척도</text>
  <text x="360" y="450" class="small">0~200센티미터 · 1센티미터 = 10픽셀 · 세 전신 동일 배율</text>
  <rect x="1980" y="414" width="280" height="54" rx="27" fill="#181916"/>
  <text x="2120" y="450" class="small white" text-anchor="middle">맨발 · 중립 자세</text>

  <!-- Full 0–200 cm grid: 200cm y=520, 0cm y=2520 -->
  <rect x="180" y="520" width="2080" height="2000" rx="8" fill="#F7F4EE"/>
  <rect x="180" y="520" width="2080" height="2000" fill="url(#minorGrid)"/>
  <rect x="180" y="520" width="2080" height="2000" fill="url(#majorGrid)"/>

  <!-- 10 cm ruler lines and labels -->
  <g>
    <line x1="180" y1="2520" x2="2260" y2="2520" stroke="#181916" stroke-width="7"/>
    <line x1="180" y1="2420" x2="2260" y2="2420" stroke="#C4BBAF" stroke-width="2"/><text x="168" y="2427" class="rulerMinor" text-anchor="end">10</text>
    <line x1="180" y1="2320" x2="2260" y2="2320" stroke="#C4BBAF" stroke-width="2"/><text x="168" y="2327" class="rulerMinor" text-anchor="end">20</text>
    <line x1="180" y1="2220" x2="2260" y2="2220" stroke="#C4BBAF" stroke-width="2"/><text x="168" y="2227" class="rulerMinor" text-anchor="end">30</text>
    <line x1="180" y1="2120" x2="2260" y2="2120" stroke="#C4BBAF" stroke-width="2"/><text x="168" y="2127" class="rulerMinor" text-anchor="end">40</text>
    <line x1="180" y1="2020" x2="2260" y2="2020" stroke="#7D3038" stroke-width="4" opacity=".72"/><text x="168" y="2027" class="rulerMajor" text-anchor="end">50</text>
    <line x1="180" y1="1920" x2="2260" y2="1920" stroke="#C4BBAF" stroke-width="2"/><text x="168" y="1927" class="rulerMinor" text-anchor="end">60</text>
    <line x1="180" y1="1820" x2="2260" y2="1820" stroke="#C4BBAF" stroke-width="2"/><text x="168" y="1827" class="rulerMinor" text-anchor="end">70</text>
    <line x1="180" y1="1720" x2="2260" y2="1720" stroke="#C4BBAF" stroke-width="2"/><text x="168" y="1727" class="rulerMinor" text-anchor="end">80</text>
    <line x1="180" y1="1620" x2="2260" y2="1620" stroke="#C4BBAF" stroke-width="2"/><text x="168" y="1627" class="rulerMinor" text-anchor="end">90</text>
    <line x1="180" y1="1520" x2="2260" y2="1520" stroke="#7D3038" stroke-width="4" opacity=".72"/><text x="168" y="1527" class="rulerMajor" text-anchor="end">100</text>
    <line x1="180" y1="1420" x2="2260" y2="1420" stroke="#C4BBAF" stroke-width="2"/><text x="168" y="1427" class="rulerMinor" text-anchor="end">110</text>
    <line x1="180" y1="1320" x2="2260" y2="1320" stroke="#C4BBAF" stroke-width="2"/><text x="168" y="1327" class="rulerMinor" text-anchor="end">120</text>
    <line x1="180" y1="1220" x2="2260" y2="1220" stroke="#C4BBAF" stroke-width="2"/><text x="168" y="1227" class="rulerMinor" text-anchor="end">130</text>
    <line x1="180" y1="1120" x2="2260" y2="1120" stroke="#C4BBAF" stroke-width="2"/><text x="168" y="1127" class="rulerMinor" text-anchor="end">140</text>
    <line x1="180" y1="1020" x2="2260" y2="1020" stroke="#7D3038" stroke-width="4" opacity=".72"/><text x="168" y="1027" class="rulerMajor" text-anchor="end">150</text>
    <line x1="180" y1="920" x2="2260" y2="920" stroke="#C4BBAF" stroke-width="2"/><text x="168" y="927" class="rulerMinor" text-anchor="end">160</text>
    <line x1="180" y1="820" x2="2260" y2="820" stroke="#C4BBAF" stroke-width="2"/><text x="168" y="827" class="rulerMinor" text-anchor="end">170</text>
    <line x1="180" y1="720" x2="2260" y2="720" stroke="#C4BBAF" stroke-width="2"/><text x="168" y="727" class="rulerMinor" text-anchor="end">180</text>
    <line x1="180" y1="620" x2="2260" y2="620" stroke="#C4BBAF" stroke-width="2"/><text x="168" y="627" class="rulerMinor" text-anchor="end">190</text>
    <line x1="180" y1="520" x2="2260" y2="520" stroke="#7D3038" stroke-width="4" opacity=".72"/><text x="168" y="527" class="rulerMajor" text-anchor="end">200</text>
    <text x="168" y="2507" class="rulerMajor" text-anchor="end">0</text>
    <text x="92" y="550" class="tiny" transform="rotate(-90 92 550)">센티미터</text>
  </g>

  <!-- Three photo placement slots -->
  <g fill="url(#slot)" opacity=".46" stroke="#FFFDF9" stroke-width="3" stroke-dasharray="14 14">
    <rect x="250" y="570" width="600" height="1900" rx="10"/>
    <rect x="900" y="570" width="600" height="1900" rx="10"/>
    <rect x="1550" y="570" width="600" height="1900" rx="10"/>
  </g>
  <g fill="none" stroke="#7D3038" stroke-width="4" opacity=".78">
    <path d="M250 612V570H292 M808 570H850V612 M250 2428V2470H292 M808 2470H850V2428"/>
    <path d="M900 612V570H942 M1458 570H1500V612 M900 2428V2470H942 M1458 2470H1500V2428"/>
    <path d="M1550 612V570H1592 M2108 570H2150V612 M1550 2428V2470H1592 M2108 2470H2150V2428"/>
  </g>

  <!-- Neutral 170 cm sample silhouettes: placeholders, not actors -->
  <g fill="#383A35" opacity=".17">
    <!-- Front -->
    <ellipse cx="550" cy="936" rx="93" ry="118"/>
    <path d="M423 1062 Q378 1135 407 1580 Q417 1740 449 1840 L497 1882 H603 L651 1840 Q683 1740 693 1580 Q722 1135 677 1062 Q615 1018 550 1020 Q485 1018 423 1062Z"/>
    <path d="M425 1110 Q320 1435 351 1740 Q372 1790 393 1735 L433 1205Z"/>
    <path d="M675 1110 Q780 1435 749 1740 Q728 1790 707 1735 L667 1205Z"/>
    <path d="M443 1834 Q425 2160 461 2473 Q494 2527 535 2513 L514 2165 L538 1880Z"/>
    <path d="M657 1834 Q675 2160 639 2473 Q606 2527 565 2513 L586 2165 L562 1880Z"/>
    <!-- Side -->
    <ellipse cx="1200" cy="936" rx="68" ry="118"/>
    <path d="M1132 1062 Q1110 1150 1070 1582 Q1118 1738 1105 1840 L1163 1882 H1237 L1295 1840 Q1282 1738 1330 1582 Q1290 1150 1268 1062 Q1235 1018 1200 1020 Q1165 1018 1132 1062Z"/>
    <path d="M1138 1110 Q978 1435 1010 1740 Q1030 1790 1052 1735 L1092 1205Z"/>
    <path d="M1262 1110 Q1422 1435 1390 1740 Q1370 1790 1348 1735 L1308 1205Z"/>
    <path d="M1097 1834 Q1080 2160 1115 2473 Q1148 2527 1190 2513 L1168 2165 L1192 1880Z"/>
    <path d="M1303 1834 Q1320 2160 1285 2473 Q1252 2527 1210 2513 L1232 2165 L1208 1880Z"/>
    <!-- Back -->
    <ellipse cx="1850" cy="936" rx="93" ry="118"/>
    <path d="M1723 1062 Q1678 1135 1707 1580 Q1717 1740 1749 1840 L1797 1882 H1903 L1951 1840 Q1983 1740 1993 1580 Q2022 1135 1977 1062 Q1915 1018 1850 1020 Q1785 1018 1723 1062Z"/>
    <path d="M1725 1110 Q1620 1435 1651 1740 Q1672 1790 1693 1735 L1733 1205Z"/>
    <path d="M1975 1110 Q2080 1435 2049 1740 Q2028 1790 2007 1735 L1967 1205Z"/>
    <path d="M1743 1834 Q1725 2160 1761 2473 Q1794 2527 1835 2513 L1814 2165 L1838 1880Z"/>
    <path d="M1957 1834 Q1975 2160 1939 2473 Q1906 2527 1865 2513 L1886 2165 L1862 1880Z"/>
  </g>
  <path d="M1748 1090 Q1850 1160 1952 1090" fill="none" stroke="#F7F4EE" stroke-width="10" opacity=".66"/>

  <!-- Placeholder stamps -->
  <g>
    <rect x="402" y="1380" width="296" height="66" rx="33" fill="#FFFDF9" opacity=".90"/>
    <text x="550" y="1423" class="small" text-anchor="middle">배우 사진 영역</text>
    <rect x="1052" y="1380" width="296" height="66" rx="33" fill="#FFFDF9" opacity=".90"/>
    <text x="1200" y="1423" class="small" text-anchor="middle">배우 사진 영역</text>
    <rect x="1702" y="1380" width="296" height="66" rx="33" fill="#FFFDF9" opacity=".90"/>
    <text x="1850" y="1423" class="small" text-anchor="middle">배우 사진 영역</text>
  </g>

  <!-- View labels -->
  <g>
    <rect x="410" y="2546" width="280" height="66" rx="33" fill="#181916"/>
    <text x="550" y="2590" class="label white" text-anchor="middle">정면</text>
    <rect x="1035" y="2546" width="330" height="66" rx="33" fill="#7D3038"/>
    <text x="1200" y="2590" class="label white" text-anchor="middle">정확한 측면</text>
    <rect x="1710" y="2546" width="280" height="66" rx="33" fill="#181916"/>
    <text x="1850" y="2590" class="label white" text-anchor="middle">후면</text>
  </g>

  <!-- Required candidate metrics only -->
  <g>
    <rect x="120" y="2700" width="680" height="220" rx="12" fill="#FFFDF9" stroke="#D5CEC3" stroke-width="2"/>
    <rect x="120" y="2700" width="10" height="220" rx="5" fill="#7D3038"/>
    <text x="166" y="2762" class="metricLabel">나이</text>
    <text x="166" y="2844" class="metricValue">성인 ·</text>
    <line x1="325" y1="2852" x2="520" y2="2852" stroke="#181916" stroke-width="3"/>
    <text x="546" y="2844" class="metricValue">세</text>
    <text x="166" y="2892" class="tiny">캐스팅 대상은 명시적인 성인</text>

    <rect x="860" y="2700" width="680" height="220" rx="12" fill="#FFFDF9" stroke="#D5CEC3" stroke-width="2"/>
    <rect x="860" y="2700" width="10" height="220" rx="5" fill="#7D3038"/>
    <text x="906" y="2762" class="metricLabel">키</text>
    <line x1="906" y1="2852" x2="1165" y2="2852" stroke="#181916" stroke-width="3"/>
    <text x="1192" y="2844" class="metricValue">센티미터</text>
    <text x="906" y="2892" class="tiny">정수리와 실측 눈금을 정확히 정렬</text>

    <rect x="1600" y="2700" width="680" height="220" rx="12" fill="#FFFDF9" stroke="#D5CEC3" stroke-width="2"/>
    <rect x="1600" y="2700" width="10" height="220" rx="5" fill="#7D3038"/>
    <text x="1646" y="2762" class="metricLabel">몸무게</text>
    <line x1="1646" y1="2852" x2="1905" y2="2852" stroke="#181916" stroke-width="3"/>
    <text x="1932" y="2844" class="metricValue">킬로그램</text>
    <text x="1646" y="2892" class="tiny">설정 수치와 체격을 함께 유지</text>
  </g>

  <!-- Footer -->
  <line x1="120" y1="3042" x2="2280" y2="3042" stroke="#C9C1B4" stroke-width="2"/>
  <text x="120" y="3094" class="small">웹툰 스튜디오 · 공통 배우 캐스팅 양식</text>
  <text x="2280" y="3094" class="small" text-anchor="end">동일 얼굴 · 동일 체형 · 동일 의상 · 동일 조명 · 동일 배율</text>
  <text x="120" y="3140" class="tiny">샘플 실루엣은 사진 배치와 눈금 확인용이며 실제 후보가 아닙니다.</text>
  <text x="2280" y="3140" class="tiny" text-anchor="end">공식 후보 파일명: body-profile.png</text>
</svg>
