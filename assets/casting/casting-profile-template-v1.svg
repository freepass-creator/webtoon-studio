      <text x="1310" y="2890">Body notes</text><text x="1670" y="2890">________________________</text>
      <text x="1310" y="2955">Face ID file</text><text x="1670" y="2955">________________________</text>
      <text x="1310" y="3020">Status</text><text x="1670" y="3020">CANDIDATE / APPROVED</text>
    </g>
