  <rect width="2400" height="3200" fill="#dedfdb"/>
  <rect x="0" y="0" width="2400" height="230" fill="#171a18"/>
  <text x="70" y="90" font-family="Arial, Helvetica, sans-serif" font-size="54" font-weight="700" fill="#ffffff">CASTING PROFILE / ABSOLUTE SCALE</text>
