      <text x="1310" y="2560" font-weight="700">PROFILE DATA</text>
      <text x="1310" y="2630">Candidate code</text><text x="1670" y="2630">________________________</text>
      <text x="1310" y="2695">Character / role</text><text x="1670" y="2695">________________________</text>
