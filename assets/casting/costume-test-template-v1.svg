  <text x="70" y="155" font-family="Arial, Helvetica, sans-serif" font-size="30" fill="#bcc1bc">MASTER TEMPLATE v1.0 · 2400 × 3200 px · 10 px = 1 cm</text>
  <text x="2330" y="92" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700" fill="#ffffff" text-anchor="end">CODE: __________</text>
  <text x="2330" y="150" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#bcc1bc" text-anchor="end">HEIGHT: ______ cm</text>
  <g transform="translate(50 300)"><use xlink:href="#scale-panel"/><text x="360" y="-28" font-family="Arial" font-size="32" font-weight="700" text-anchor="middle">LOOK 01</text></g>
