      <text x="880" y="2540" font-weight="700">LOOK 02</text><text x="880" y="2610">Name / rank  __________________</text><text x="880" y="2675">Color  _______________________</text><text x="880" y="2740">Hair / accessory  _____________</text><text x="880" y="2805">Shoes  _______________________</text><text x="880" y="2870">Scene use  ___________________</text>
